{{define "register.html"}}{{template "layout" .}}{{end}}

{{define "content"}}
<section class="card">
  <h2 class="card__title">Регистрация</h2>
  <form class="form" method="post" action="/register">
    <label class="field">
      <span class="field__label">ФИО</span>
      <input class="field__input" type="text" name="full_name" placeholder="Иванов Иван Иванович" required>
    </label>
    <label class="field">
      <span class="field__label">Email</span>
      <input class="field__input" type="email" name="email" placeholder="you@example.com" required>
    </label>
    <label class="field">
      <span class="field__label">Пароль</span>
      <input class="field__input" type="password" name="password" required>
    </label>
    <label class="field">
      <span class="field__label">Повторите пароль</span>
      <input class="field__input" type="password" name="password_confirm" required>
    </label>
    <button class="btn btn--primary btn--block" type="submit">Создать аккаунт</button>
  </form>
  <div class="hint">Уже есть аккаунт? <a href="/login">Войти</a></div>
  <div class="hint hint--muted">Этап 1: форма пока без серверной обработки.</div>
</section>
{{end}}
